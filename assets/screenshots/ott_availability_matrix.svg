<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="modalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181d28"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="20" fill="url(#modalBg)" stroke="#2b3245" stroke-width="2"/>

  <!-- Modal Header -->
  <g transform="translate(40, 40)">
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff">Where to Watch in India (Region: IN)</text>
    <text x="0" y="48" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#888888">Verified Legal OTT Streaming Providers &amp; Purchase Options</text>
  </g>

  <!-- OTT Option 1: Netflix (Leo) -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="920" height="75" rx="12" fill="#141414" stroke="#333333" stroke-width="1"/>
    <!-- Logo Badge -->
    <rect x="20" y="15" width="45" height="45" rx="8" fill="#E50914"/>
    <text x="42" y="44" font-family="Impact, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>

    <!-- Details -->
    <text x="85" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Netflix</text>
    <text x="85" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#00E676">Included with Subscription • 4K Dolby Vision</text>

    <!-- Watch Button -->
    <rect x="760" y="18" width="140" height="38" rx="8" fill="#E50914"/>
    <text x="830" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Watch on Netflix ↗</text>
  </g>

  <!-- OTT Option 2: JioHotstar (Vikram) -->
  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="920" height="75" rx="12" fill="#141414" stroke="#333333" stroke-width="1"/>
    <rect x="20" y="15" width="45" height="45" rx="8" fill="#002B66"/>
    <text x="42" y="44" font-family="Impact, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">★</text>

    <text x="85" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">JioHotstar / Disney+</text>
    <text x="85" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#00E676">Included with Subscription • 4K UHD</text>

    <rect x="760" y="18" width="140" height="38" rx="8" fill="#003882"/>
    <text x="830" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Watch on Hotstar ↗</text>
  </g>

  <!-- OTT Option 3: Amazon Prime Video (Jailer) -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="920" height="75" rx="12" fill="#141414" stroke="#333333" stroke-width="1"/>
    <rect x="20" y="15" width="45" height="45" rx="8" fill="#00A8E1"/>
    <text x="42" y="44" font-family="Impact, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>

    <text x="85" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Amazon Prime Video</text>
    <text x="85" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#00E676">Included with Prime • 4K UHD</text>

    <rect x="760" y="18" width="140" height="38" rx="8" fill="#0082B3"/>
    <text x="830" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Watch on Prime ↗</text>
  </g>

  <!-- OTT Option 4: STREAMVERSE Own Streaming -->
  <g transform="translate(40, 380)">
    <rect x="0" y="0" width="920" height="75" rx="12" fill="#0d241d" stroke="#10B981" stroke-width="1.5"/>
    <rect x="20" y="15" width="45" height="45" rx="8" fill="#10B981"/>
    <text x="42" y="44" font-family="Impact, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">SV</text>

    <text x="85" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">STREAMVERSE Original (Part B)</text>
    <text x="85" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#34D399">In-Browser Adaptive Streaming • 4K HDR</text>

    <rect x="760" y="18" width="140" height="38" rx="8" fill="#10B981"/>
    <text x="830" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Play in App ▶</text>
  </g>

  <!-- Bottom Legal Note -->
  <text x="500" y="490" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#666666" text-anchor="middle">
    All external links redirect directly to authorized OTT providers. Powered by TMDB &amp; JustWatch attribution.
  </text>
</svg>

