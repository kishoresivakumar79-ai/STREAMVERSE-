<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="playerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Video Background Simulation -->
  <rect width="1200" height="675" fill="#070a10"/>
  <circle cx="600" cy="300" r="180" fill="#E50914" fill-opacity="0.15"/>

  <!-- Cinema Overlay Gradient -->
  <rect width="1200" height="675" fill="url(#playerGrad)"/>

  <!-- Top Bar -->
  <g transform="translate(60, 50)">
    <!-- Back arrow -->
    <path d="M 0 16 L 24 0 L 24 32 Z" fill="#ffffff"/>
    <text x="45" y="16" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff">The Last Horizon</text>
    <rect x="250" y="2" width="140" height="20" rx="3" fill="#E50914"/>
    <text x="320" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">STREAMVERSE ORIGINAL</text>

    <rect x="400" y="2" width="60" height="20" rx="3" fill="#222222"/>
    <text x="430" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#cccccc" text-anchor="middle">4K HDR</text>

    <rect x="470" y="2" width="100" height="20" rx="3" fill="#222222"/>
    <text x="520" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#cccccc" text-anchor="middle">DOLBY ATMOS 5.1</text>
  </g>

  <!-- Center Play / Pause Indicator -->
  <circle cx="600" cy="337" r="45" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-width="2"/>
  <polygon points="590,320 590,355 620,337" fill="#ffffff"/>

  <!-- Bottom Player Controls -->
  <g transform="translate(60, 560)">
    <!-- Scrubber Bar -->
    <rect x="0" y="0" width="1080" height="6" rx="3" fill="#444444"/>
    <rect x="0" y="0" width="480" height="6" rx="3" fill="#E50914"/>
    <circle cx="480" cy="3" r="8" fill="#E50914"/>

    <!-- Left Controls Cluster -->
    <g transform="translate(0, 35)">
      <!-- Pause icon -->
      <rect x="0" y="0" width="6" height="20" rx="2" fill="#ffffff"/>
      <rect x="12" y="0" width="6" height="20" rx="2" fill="#ffffff"/>

      <!-- 10s Rewind -->
      <circle cx="60" cy="10" r="14" fill="transparent" stroke="#ffffff" stroke-width="2"/>
      <text x="60" y="14" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">10</text>

      <!-- 10s Forward -->
      <circle cx="105" cy="10" r="14" fill="transparent" stroke="#ffffff" stroke-width="2"/>
      <text x="105" y="14" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">10</text>

      <!-- Volume icon -->
      <path d="M 150 4 L 160 4 L 170 -2 L 170 22 L 160 16 L 150 16 Z" fill="#ffffff"/>

      <!-- Time Stamp -->
      <text x="200" y="15" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#aaaaaa">09:42 / 24:18</text>
    </g>

    <!-- Right Controls Cluster -->
    <g transform="translate(850, 35)">
      <!-- Audio & Subtitles -->
      <rect x="0" y="0" width="115" height="26" rx="5" fill="#222222" stroke="#444444" stroke-width="1"/>
      <text x="57" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Tamil (5.1) • Sub</text>

      <!-- Speed -->
      <rect x="130" y="0" width="45" height="26" rx="5" fill="#222222" stroke="#444444" stroke-width="1"/>
      <text x="152" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1.0x</text>

      <!-- Fullscreen Icon -->
      <rect x="195" y="2" width="22" height="22" rx="3" fill="transparent" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>
</svg>

